<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Affordable Toggle</title>

<style>
:root{
  --bg:#0b0b0c;
  --track-light:#1b1b1f;
  --track-dark:#0f0f11;
  --orange:#ff7a00;
}

*{box-sizing:border-box;}

body{
  margin:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle at center,#111 0%,#0b0b0c 70%);
  font-family:Arial, sans-serif;
}

/* Toggle */
.toggle{
  width:260px;
  height:100px;
  position:relative;
  margin-bottom:25px;
}

.toggle input{
  display:none;
}

.track{
  width:100%;
  height:100%;
  border-radius:70px;
  background:linear-gradient(145deg,var(--track-light),var(--track-dark));
  box-shadow:
    inset 12px 12px 25px #070708,
    inset -12px -12px 25px #202024;
  position:relative;
  cursor:pointer;
  overflow:hidden;
  transition:0.4s ease;
}

.status{
  position:absolute;
  right:55px;
  top:50%;
  transform:translateY(-50%);
  letter-spacing:4px;
  font-size:14px;
  color:#26262a;
  transition:0.8s ease;
}
  .statusOFF{
  position:absolute;
  left:55px;
  top:50%;
  transform:translateY(-50%);
  letter-spacing:4px;
  font-size:14px;
  color:#26262a;
  transition:0.8s ease;
}
input:checked + .track .statusOFF{
  color:var(--orange);
  text-shadow:0 0 8px rgba(255,122,0,0.4);
}
input:checked + .track .status{
  color:var(--orange);
  text-shadow:0 0 8px rgba(255,122,0,0.4);
}

.knob{
  position:absolute;
  top:18px;
  left:18px;
  width:64px;
  height:64px;
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #1e1e22, #0a0a0c);
  box-shadow:
    10px 10px 20px #000,
    -5px -5px 15px #1a1a1d;
  display:flex;
  justify-content:center;
  align-items:center;
  transition:
    transform 0.6s cubic-bezier(0.68,-0.6,0.32,1.6),
    filter 0.4s ease;
}

input:checked + .track .knob{
  transform:translateX(155px);
}

.ring{
  width:38px;
  height:38px;
  border-radius:50%;
  border:4px solid #2b2b2f;
  transition:0.4s ease;
}

input:checked + .track .ring{
  border-color:var(--orange);
  background:
    radial-gradient(circle at center,
      rgba(255,122,0,0.45) 0%,
      rgba(255,122,0,0.25) 35%,
      rgba(255,122,0,0.08) 55%,
      transparent 70%);
  box-shadow:
    inset 0 0 8px rgba(255,122,0,0.6),
    0 0 12px rgba(255,122,0,0.35);
}

/* Watermark */
.watermark{
  font-size:14px;
  letter-spacing:1px;
  color:#444;
  opacity:0.7;
  text-align:center;
  transition:0.3s ease;
}

.watermark span{
  color:var(--orange);
}

.watermark:hover{
  opacity:1;
}
</style>
</head>

<body>

<label class="toggle">
  <input type="checkbox">
  <div class="track">
    <div class="status">ON</div>
    <div class="statusOFF">OFF</div>
    <div class="knob">
      <div class="ring"></div>
    </div>
  </div>
</label>

<div class="watermark">
  Made with 🖤 by <span>RK Studios</span>
</div>

</body>
</html>
