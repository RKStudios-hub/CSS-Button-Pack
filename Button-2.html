<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra Kawaii Button</title>

<style>
:root{
  --pink1:#ffd6ec;
  --pink2:#ff9ecf;
  --pink3:#ff6fb5;
  --shadow:#ffb3d9;
}

*{box-sizing:border-box;}

body{
  margin:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#fff5fb,#ffe6f5);
  font-family:"Comic Sans MS", cursive, sans-serif;
}

/* BUTTON */
.kawaii-btn{
  position:relative;
  padding:22px 60px;
  font-size:22px;
  font-weight:bold;
  color:#ff4fa3;
  border:none;
  border-radius:60px;
  cursor:pointer;
  overflow:hidden;

  background:linear-gradient(120deg,#fff,#ffd6ec,#fff);
  background-size:200% 200%;
  animation:shimmer 4s ease infinite;

  box-shadow:
    0 14px 0 var(--shadow),
    0 20px 35px rgba(255,105,180,0.25),
    inset 0 -6px 10px rgba(255,255,255,0.8);

  transition:
    transform 0.12s ease,
    box-shadow 0.12s ease;
}

/* REAL PRESS DOWN */
.kawaii-btn:active{
  transform:translateY(10px) scale(0.97);

  box-shadow:
    0 4px 0 var(--shadow),
    0 8px 15px rgba(255,105,180,0.2),
    inset 0 6px 12px rgba(0,0,0,0.08);
}

/* Spring release */
.kawaii-btn:not(:active){
  transition:
    transform 0.25s cubic-bezier(0.34,1.56,0.64,1),
    box-shadow 0.25s cubic-bezier(0.34,1.56,0.64,1);
}

/* SHIMMER */
@keyframes shimmer{
  0%{ background-position:0% 50%; }
  50%{ background-position:100% 50%; }
  100%{ background-position:0% 50%; }
}

/* FACE */
.face{ display:inline-block; }

.eye{
  display:inline-block;
  animation:blink 4s infinite;
}

@keyframes blink{
  0%,95%,100%{ transform:scaleY(1); }
  97%{ transform:scaleY(0.1); }
}

/* Sparkles */
.sparkle{
  position:absolute;
  width:6px;
  height:6px;
  background:var(--pink3);
  border-radius:50%;
  opacity:0;
  pointer-events:none;
}

@keyframes sparkleFloat{
  0%{ transform:translateY(0) scale(0.5); opacity:1; }
  100%{ transform:translateY(-40px) scale(1.4); opacity:0; }
}

.kawaii-btn:hover .sparkle{
  animation:sparkleFloat 1s ease forwards;
}

.sparkle:nth-child(2){ left:15%; animation-delay:0.1s; }
.sparkle:nth-child(3){ left:50%; animation-delay:0.2s; }
.sparkle:nth-child(4){ left:80%; animation-delay:0.3s; }

/* Hearts */
.heart{
  position:absolute;
  font-size:18px;
  opacity:0;
  pointer-events:none;
}

@keyframes heartBurst{
  0%{ transform:translateY(0) scale(0.6); opacity:1; }
  100%{ transform:translateY(-60px) scale(1.5); opacity:0; }
}

.kawaii-btn:focus .heart{
  animation:heartBurst 1s ease forwards;
}

.heart:nth-child(5){ left:30%; animation-delay:0.1s; }
.heart:nth-child(6){ left:60%; animation-delay:0.2s; }

/* WATERMARK */
.watermark{
  margin-top:25px;
  font-size:14px;
  color:#ff6fb5;
  opacity:0.85;
  letter-spacing:1px;
  transition:0.3s ease;
}

.watermark:hover{
  text-shadow:0 0 8px rgba(255,111,181,0.6);
}
</style>
</head>

<body>

<button class="kawaii-btn">
  <span class="face">
    <span class="eye">＾</span>◡<span class="eye">＾</span>
  </span>
  &nbsp;Click Me♡

  <span class="sparkle"></span>
  <span class="sparkle"></span>
  <span class="sparkle"></span>

  <span class="heart">💗</span>
  <span class="heart">💖</span>
</button>

<div class="watermark">
  Made with 🖤 by <strong>RK Studios</strong>
</div>

</body>
</html>
