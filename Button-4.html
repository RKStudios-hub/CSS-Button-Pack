<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desert Toggle</title>

<!-- Font Awesome -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:#e6e6e6;
  font-family:Arial, sans-serif;
}

/* ===== TOGGLE BODY ===== */
.toggle{
  position:relative;
  width:520px;
  height:220px;
  border-radius:120px;
  overflow:hidden;
  cursor:pointer;
  transition:1s ease;
  box-shadow:
    0 30px 50px rgba(0,0,0,0.25),
    inset 0 6px 12px rgba(255,255,255,0.6);
}

/* ===== SKY ===== */
.sky{
  position:absolute;
  width:100%;
  height:100%;
  background:linear-gradient(160deg,#1a237e,#0f2027);
  transition:1s ease;
}

.toggle.active .sky{
  background:linear-gradient(160deg,#ffd54f,#ff8f00);
}

/* ===== STARS ===== */
.star{
  position:absolute;
  width:3px;
  height:3px;
  background:white;
  border-radius:50%;
  animation:twinkle 2s infinite alternate;
  transition:opacity 0.8s ease;
}
@keyframes twinkle{
  from{opacity:0.4;}
  to{opacity:1;}
}
.toggle.active .star{
  opacity:0;
}

/* ===== 3D CLOUDS ===== */
.cloud{
  position:absolute;
  width:120px;
  height:60px;
  top:60px;
  opacity:0;
  transition:opacity 1s ease;
  filter:drop-shadow(0 10px 12px rgba(0,0,0,0.15));
}

.cloud .layer{
  position:absolute;
  background:radial-gradient(circle at 30% 30%, #ffffff, #e6e6e6);
  border-radius:50%;
}

.cloud .layer:nth-child(1){
  width:70px; height:70px; left:0; top:10px;
}
.cloud .layer:nth-child(2){
  width:90px; height:90px; left:30px; top:-10px;
}
.cloud .layer:nth-child(3){
  width:65px; height:65px; left:75px; top:15px;
}

.toggle.active .cloud{
  opacity:1;
}

/* ===== GROUND ===== */
.ground{
  position:absolute;
  bottom:-70px;
  width:100%;
  height:180px;
  background:radial-gradient(circle at 50% -100px,#ffffff,#e0e0e0);
  border-radius:50%;
  box-shadow:inset 0 20px 30px rgba(0,0,0,0.08);
}

/* ===== CAMEL (Font Awesome) ===== */
.camel{
  position:absolute;
  bottom:75px;
  left:58%;
  font-size:45px;
  color:white;
  animation:camelIdle 3s ease-in-out infinite;
  filter:drop-shadow(0 10px 10px rgba(0,0,0,0.3));
}

@keyframes camelIdle{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-6px);}
}

/* ===== KNOB ===== */
.knob{
  position:absolute;
  top:15px;
  left:15px;
  width:190px;
  height:190px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:60px;
  color:#f5c518;
  background:radial-gradient(circle at 35% 30%,#ffffff,#e5e5e5);
  transition:0.9s cubic-bezier(.68,-0.55,.27,1.55);
  box-shadow:
    0 20px 30px rgba(0,0,0,0.3),
    inset 6px 6px 12px rgba(0,0,0,0.08),
    inset -6px -6px 12px rgba(255,255,255,0.9);
}

.toggle.active .knob{
  left:315px;
}

/* Moon icon */
.knob i{
  transition:0.8s ease;
}

.toggle.active .knob i{
  content:"";
  color:#ff9800;
}

/* WATERMARK */
.watermark{
  margin-top:30px;
  font-size:14px;
  color:#555;
  letter-spacing:1px;
  opacity:0.85;
}
.watermark strong{color:#000;}
</style>
</head>

<body>

<div class="toggle" id="toggle">

  <div class="sky"></div>

  <!-- Stars -->
  <div class="star" style="top:40px;left:100px;"></div>
  <div class="star" style="top:80px;left:250px;"></div>
  <div class="star" style="top:60px;left:420px;"></div>

  <!-- 3D Clouds -->
  <div class="cloud" style="left:120px;">
      <div class="layer"></div>
      <div class="layer"></div>
      <div class="layer"></div>
  </div>

  <div class="cloud" style="left:330px; top:90px;">
      <div class="layer"></div>
      <div class="layer"></div>
      <div class="layer"></div>
  </div>

  <!-- Ground -->
  <div class="ground"></div>

  <!-- Camel -->
  <i class="fa-solid fa-camel camel"></i>

  <!-- Knob -->
  <div class="knob">
      <i class="fa-solid fa-moon"></i>
  </div>

</div>

<div class="watermark">
  Made with 🖤 by <strong>RK Studios</strong>
</div>

<script>
const toggle = document.getElementById("toggle");
const knobIcon = document.querySelector(".knob i");

toggle.addEventListener("click",()=>{
  toggle.classList.toggle("active");

  if(toggle.classList.contains("active")){
    knobIcon.classList.remove("fa-moon");
    knobIcon.classList.add("fa-sun");
  } else {
    knobIcon.classList.remove("fa-sun");
    knobIcon.classList.add("fa-moon");
  }
});
</script>

</body>
</html>
